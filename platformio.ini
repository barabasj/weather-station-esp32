; =====================================================================
;  Estacion de clima para ideaspark ESP32 (ESP-WROOM-32) con TFT 1.9"
;  ST7789 170x320.  Abrir esta carpeta con VS Code + PlatformIO.
;  La configuracion del usuario (WiFi, ciudad, etc.) esta en src/config.h
; =====================================================================

[env:ideaspark]
platform = espressif32@6.9.0          ; Arduino core 2.0.17 (estable con TFT_eSPI)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv ; 2 x 1,5 MB (actualizacion por WiFi) + 896 KB de fotos
board_build.filesystem = littlefs     ; fotos propias en la carpeta data/

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@^7.2.1
    bodmer/TJpg_Decoder@^1.1.0
    tzapu/WiFiManager@^2.0.17

; ---- Configuracion de la pantalla (reemplaza al User_Setup.h de TFT_eSPI) ----
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    ; Si los colores salen con rojo y azul intercambiados, descomentar:
    ; -D TFT_RGB_ORDER=TFT_BGR
    ; Si los colores salen "en negativo", descomentar:
    ; -D TFT_INVERSION_OFF=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
